<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo 3D Interactivo</title>
    <link rel="stylesheet" href="cubo.css">
</head>
<body>
    <main>
        <h1>Cubo 3D Interactivo</h1>
        <p>HTML + CSS + JavaScript</p>

        <div class="cubo" id="cubo">
            <div class="face frente">1</div>
            <div class="face tras">2</div>
            <div class="face esquerda">3</div>
            <div class="face direita">4</div>
            <div class="face cima">5</div>
            <div class="face baixo">6</div>
        </div>

        <div class="controlo">
            <button class="botoes" id="pausa">PAUSAR</button>
            <button class="botoes" id="rapido">+ RÁPIDO</button>
            <button class="botoes" id="lento">+ LENTO</button>
            <button class="botoes" id="mais">AUMENTAR</button>
            <button class="botoes" id="menos">DIMINUIR</button>
            <button class="botoes" id="reset">RESETAR</button>
        </div>
    </main>

    <script src="cubo.js"></script>
</body>
</html>
